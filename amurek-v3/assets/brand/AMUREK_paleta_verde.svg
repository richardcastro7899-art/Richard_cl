<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1700" width="1640" height="1700"><rect width="1640" height="1700" fill="#FFFFFF"/><text x="60" y="80" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:30px;font-weight:700" fill="#0A0A0A">AMUREK · paleta verde neón y reglas de composición</text><text x="60" y="114" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:18px;font-weight:400" fill="#4A4A48">El verde #00FF8B es el acento. Fondo negro casi puro, blanco y grises que lo acompañan.</text><rect x="60" y="150" width="1520" height="560" fill="#0A0A0A"/><g transform="translate(100,160) scale(0.25)"><g transform="translate(23.87,-2.63)"><path fill="#F5F5F3" fill-rule="evenodd" d="M147.24,198.53A56.085 56.085 0 1 1 186.66,144.97V201.06H160.54V144.97A29.965 29.965 0 1 0 147.24,169.88Z"/><path fill="#F5F5F3" fill-rule="evenodd" d="M200.07 135.54L200.07 201.06L226.19 201.06L226.19 135.54Q226.19 131.35 227.8 127.55Q229.36 123.87 232.2 121.02Q235.05 118.18 238.73 116.62Q242.53 115.01 246.72 115.01Q250.91 115.01 254.71 116.62Q258.39 118.18 261.24 121.02Q264.08 123.87 265.64 127.55Q267.25 131.35 267.25 135.54L267.25 201.06L293.37 201.06L293.37 135.54Q293.37 131.35 294.98 127.55Q296.54 123.87 299.38 121.02Q302.23 118.18 305.91 116.62Q309.71 115.01 313.9 115.01Q318.09 115.01 321.89 116.62Q325.57 118.18 328.42 121.02Q331.26 123.87 332.82 127.55Q334.43 131.35 334.43 135.54L334.43 154.41Q334.43 163.89 338.1 172.57Q341.64 180.95 348.09 187.4Q354.54 193.85 362.92 197.39Q371.6 201.06 381.08 201.06Q390.56 201.06 399.24 197.39Q407.62 193.85 414.07 187.4Q420.52 180.95 424.06 172.57Q427.73 163.89 427.73 154.41L427.73 88.89L401.61 88.89L401.61 154.41Q401.61 158.6 400 162.4Q398.44 166.08 395.6 168.93Q392.75 171.77 389.07 173.33Q385.27 174.94 381.08 174.94Q376.89 174.94 373.09 173.33Q369.41 171.77 366.56 168.93Q363.72 166.08 362.16 162.4Q360.55 158.6 360.55 154.41L360.55 135.54Q360.55 126.06 356.88 117.3
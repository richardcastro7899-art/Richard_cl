="font-family:'DM Sans',sans-serif;font-size:104px;font-weight:700" fill="#F5F5F3">encuentra forma<tspan fill="#00FF8B">.</tspan></text><text x="100" y="580" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:400" fill="#8C8C8A">Branding, producción audiovisual y contenido para marcas que quieren crecer.</text><text x="100" y="640" text-anchor="start" letter-spacing="1" style="font-family:'DM Sans',sans-serif;font-size:16px;font-weight:700" fill="#F5F5F3">VER PROYECTOS →</text><rect x="1060" y="290" width="480" height="380" fill="#1A1A1A"/><text x="1300" y="485" text-anchor="middle" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#8C8C8A">fotografía / video</text><rect x="60" y="710" width="1520" height="300" fill="#F5F5F3"/><text x="100" y="780" text-anchor="start" letter-spacing="2" style="font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600" fill="#4A4A48">02 / PRODUCCIÓN AUDIOVISUAL</text><text x="100" y="880" letter-spacing="-2" style="font-family:'DM Sans',sans-serif;font-size:72px;font-weight:700" fill="#0A0A0A">Producción completa<tspan fill="#007A46">.</tspan></text><text x="100" y="940" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:19px;font-weight:400" fill="#4A4A48">No grabamos con el celular: dirigimos, producimos y postproducimos cada pieza.</text><rect x="1060" y="770" width="150" height="190" fill="#DEDEDB"/><rect x="1225" y="770" width="150" height="190" fill="#DEDEDB"/><rect x="1390" y="770" width="150" height="190" fill="#DEDEDB"/><text x="60" y="1040" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:14px;font-weight:400" fill="#8C8C8A">Ejemplo de web: base negra con alguna sección clara. El verde neón va solo sobre negro; sobre blanco se usa el verde profundo.</text><rect x="60.0" y="1090" width="205.1" height="130" fill="#00FF8B" stroke="#DEDEDB"/><text x="60.0" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Verde neón</text><text x="60.0" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#00FF8B</text><text x="60.0" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Acento sobre negro</text><rect x="279.1" y="1090" width="205.1" height="130" fill="#007A46" stroke="#DEDEDB"/><text x="279.1428571428571" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Verde profundo</text><text x="279.1428571428571" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#007A46</text><text x="279.1428571428571" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Acento sobre blanco</text><rect x="498.3" y="1090" width="205.1" height="130" fill="#0A0A0A" stroke="#DEDEDB"/><text x="498.2857142857143" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Negro</text><text x="498.2857142857143" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#0A0A0A</text><text x="498.2857142857143" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Fondo principal</text><rect x="717.4" y="1090" width="205.1" height="130" fill="#1A1A1A" stroke="#DEDEDB"/><text x="717.4285714285714" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Negro superficie</text><text x="717.4285714285714" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#1A1A1A</text><text x="717.4285714285714" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Tarjetas y bloques sobre negro</text><rect x="936.6" y="1090" width="205.1" height="130" fill="#F5F5F3" stroke="#DEDEDB"/><text x="936.5714285714286" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Blanco</text><text x="936.5714285714286" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#F5F5F3</text><text x="936.5714285714286" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Texto sobre negro, fondo claro</text><rect x="1155.7" y="1090" width="205.1" height="130" fill="#8C8C8A" stroke="#DEDEDB"/><text x="1155.7142857142858" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Gris medio</text><text x="1155.7142857142858" y="1274" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400" fill="#4A4A48">#8C8C8A</text><text x="1155.7142857142858" y="1296" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:400" fill="#8C8C8A">Texto secundario sobre negro</text><rect x="1374.9" y="1090" width="205.1" height="130" fill="#2A2A29" stroke="#DEDEDB"/><text x="1374.857142857143" y="1250" text-anchor="start" letter-spacing="0" style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:700" fill="#0A0A0A">Gris línea</text><text x="1374.857142857143" y="1